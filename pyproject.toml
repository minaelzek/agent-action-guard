[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-action-guard"
version = "0.1.0"
description = "Offline allow/block guardrails for agent prompts and tool calls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[tool.setuptools]
packages = ["agent_action_guard"]
